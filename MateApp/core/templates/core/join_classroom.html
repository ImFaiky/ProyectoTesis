{% extends 'core/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0" style="border-radius: 16px;">
            <div class="card-body p-4 text-center">
                <div class="mb-4">
                    <i class="bi bi-search" style="font-size: 3rem; color: #667eea;"></i>
                    <h3 class="mt-2 fw-bold">Join a Classroom</h3>
                    <p class="text-muted">Enter the code and password provided by your teacher.</p>
                </div>

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3 text-start">
                        <label for="code" class="form-label fw-bold">Classroom Code</label>
                        <input type="text" class="form-control form-control-lg text-center" id="code" name="code"
                               placeholder="E.g.: ABC123" required maxlength="10"
                               style="font-family: monospace; font-size: 1.5rem; letter-spacing: 4px; text-transform: uppercase;">
                    </div>

                    <div class="mb-4 text-start">
                        <label for="password" class="form-label fw-bold">Password</label>
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="Classroom password" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100">
                        <i class="bi bi-box-arrow-in-right"></i> Join
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
