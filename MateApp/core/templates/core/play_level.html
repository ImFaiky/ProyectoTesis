{% extends 'core/base.html' %}
{% load static %}

{% block content %}
<div class="container-fluid py-4">
    <!-- Animated Background -->
    <div class="animated-bg">
        <div class="floating-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
            <div class="shape shape-4"></div>
            <div class="shape shape-5"></div>
        </div>
    </div>

    <!-- Enhanced Game Header -->
    <div class="row mb-4">
        <div class="col-12">
            <div class="game-header-card">
                <div class="row align-items-center">
                    <div class="col-md-6">
                        <div class="d-flex align-items-center">
                            <div class="level-badge me-3">
                                <span class="level-number">{{ level.number }}</span>
                            </div>
                            <div>
                                <h2 class="game-title mb-1">{{ level.discipline.name }}</h2>
                                <div class="progress-info">
                                    <span class="current-question">Question <span id="current-q-num">1</span></span>
                                    <span class="divider">of</span>
                                    <span class="total-questions" id="total-q-num">--</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6 text-md-end">
                        <div class="game-stats">
                            <div class="stat-item">
                                <div class="stat-icon stat-icon-time">
                                    <i class="bi bi-stopwatch-fill"></i>
                                </div>
                                <div class="stat-content">
                                    <div class="stat-value" id="timer-display">00:00</div>
                                    <div class="stat-label">Time</div>
                                </div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-icon">
                                    <i class="bi bi-trophy-fill"></i>
                                </div>
                                <div class="stat-content">
                                    <div class="stat-value" id="score-display">0</div>
                                    <div class="stat-label">Score</div>
                                </div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-icon">
                                    <i class="bi bi-star-fill"></i>
                                </div>
                                <div class="stat-content">
                                    <div class="stars-display" id="stars-display">
                                        <i class="bi bi-star"></i>
                                        <i class="bi bi-star"></i>
                                        <i class="bi bi-star"></i>
                                    </div>
                                    <div class="stat-label">Stars</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Enhanced Game Container -->
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="game-card" id="game-container">
                <!-- Loading State -->
                <div class="loading-screen">
                    <div class="loading-animation">
                        <div class="loader-circle"></div>
                        <div class="loader-circle"></div>
                        <div class="loader-circle"></div>
                    </div>
                    <h3 class="loading-text">Preparing your adventure...</h3>
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden Form for Submission -->
    <form method="post" id="game-form" style="display:none;">
        {% csrf_token %}
        <input type="hidden" name="score" id="input-score">
        <input type="hidden" name="stars" id="input-stars">
        <input type="hidden" name="answers" id="input-answers">
        <input type="hidden" name="time_seconds" id="input-time">
    </form>
</div>

<!-- Config Data -->
{{ level.game_config|json_script:"game-config-data" }}

<script>
    // --- Enhanced Game State ---
    let config = {};
    let questions = [];
    let currentIndex = 0;
    let score = 0;
    let maxScore = 0;
    let correctCount = 0;
    let userAnswers = [];
    let combo = 0;
    let maxCombo = 0;
    let gameStartTime = null;
    let timerInterval = null;
    let elapsedSeconds = 0;

    // --- Sound Effects (using Web Audio API for simple sounds) ---
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSound(frequency, duration, type = 'sine') {
        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();
        
        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);
        
        oscillator.frequency.value = frequency;
        oscillator.type = type;
        
        gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
        
        oscillator.start(audioContext.currentTime);
        oscillator.stop(audioContext.currentTime + duration);
    }
    
    function playSuccessSound() {
        playSound(523, 0.1); // C
        setTimeout(() => playSound(659, 0.1), 100); // E
        setTimeout(() => playSound(784, 0.2), 200); // G
    }
    
    function playErrorSound() {
        playSound(200, 0.3, 'sawtooth');
    }
    
    function playClickSound() {
        playSound(600, 0.05);
    }

    // --- Inits ---
    document.addEventListener('DOMContentLoaded', () => {
        const scriptTag = document.getElementById('game-config-data');
        try {
            const raw = JSON.parse(scriptTag.textContent);
            if (Array.isArray(raw.questions)) {
                questions = raw.questions;
            } else {
                questions = [];
                for (const [key, val] of Object.entries(raw)) {
                    if (val && (val.question || val.pairs)) {
                        val.type = key;
                        questions.push(val);
                    }
                }
            }
        } catch (e) {
            console.error("Error parsing game config", e);
            questions = [];
        }

        if (questions.length === 0) {
            showEmptyState();
            return;
        }

        document.getElementById('total-q-num').textContent = questions.length;
        maxScore = questions.length * 10;

        setTimeout(() => startGame(), 1000);
    });

    function startTimer() {
        gameStartTime = Date.now();
        elapsedSeconds = 0;
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            elapsedSeconds = Math.floor((Date.now() - gameStartTime) / 1000);
            const mins = String(Math.floor(elapsedSeconds / 60)).padStart(2, '0');
            const secs = String(elapsedSeconds % 60).padStart(2, '0');
            document.getElementById('timer-display').textContent = `${mins}:${secs}`;
        }, 1000);
    }

    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
        elapsedSeconds = Math.floor((Date.now() - gameStartTime) / 1000);
        return elapsedSeconds;
    }

    function showEmptyState() {
        const container = document.getElementById('game-container');
        container.innerHTML = `
            <div class="empty-state">
                <div class="empty-icon">
                    <i class="bi bi-emoji-frown"></i>
                </div>
                <h3>No questions in this level yet!</h3>
                <p class="text-muted">Check back later for new challenges.</p>
                <a href="{% url 'dashboard' %}" class="btn btn-primary btn-lg">
                    <i class="bi bi-house-door me-2"></i>Back to Dashboard
                </a>
            </div>
        `;
    }

    function startGame() {
        currentIndex = 0;
        score = 0;
        correctCount = 0;
        combo = 0;
        maxCombo = 0;
        userAnswers = [];
        startTimer();
        updateStats();
        showQuestion(currentIndex);
    }

    function updateStats() {
        // Animate score change
        const scoreElement = document.getElementById('score-display');
        const currentScore = parseInt(scoreElement.textContent);
        animateValue(scoreElement, currentScore, score, 500);
        
        document.getElementById('current-q-num').textContent = currentIndex + 1;
        
        // Update stars with animation
        updateStars();
    }

    function animateValue(element, start, end, duration) {
        // Cancel any previous animation on this element
        if (element._scoreTimer) clearInterval(element._scoreTimer);

        // Nothing to animate
        if (start === end) {
            element.textContent = end;
            return;
        }

        const range = end - start;
        const increment = range / (duration / 16);
        let current = start;
        
        element._scoreTimer = setInterval(() => {
            current += increment;
            if ((increment > 0 && current >= end) || (increment < 0 && current <= end)) {
                element.textContent = end;
                clearInterval(element._scoreTimer);
                element._scoreTimer = null;
            } else {
                element.textContent = Math.round(current);
            }
        }, 16);
    }

    function showScorePopup(points) {
        const scoreEl = document.getElementById('score-display');
        const popup = document.createElement('div');
        popup.className = 'score-popup';
        popup.textContent = `+${points}`;
        scoreEl.parentElement.style.position = 'relative';
        scoreEl.parentElement.appendChild(popup);
        setTimeout(() => popup.remove(), 900);

        // Bounce effect on the score number
        scoreEl.classList.remove('score-bounce');
        void scoreEl.offsetWidth; // force reflow to restart animation
        scoreEl.classList.add('score-bounce');
    }

    function updateStars() {
        const starsDisplay = document.getElementById('stars-display');
        const percent = (score / maxScore) * 100;
        let stars = 1;
        if (percent > 60) stars = 3;
        else if (percent > 30) stars = 2;
        
        let starsHTML = '';
        for (let i = 0; i < 3; i++) {
            if (i < stars) {
                starsHTML += '<i class="bi bi-star-fill star-active"></i>';
            } else {
                starsHTML += '<i class="bi bi-star star-inactive"></i>';
            }
        }
        starsDisplay.innerHTML = starsHTML;
    }

    // --- Enhanced Renderers ---
    function showQuestion(index) {
        if (index >= questions.length) {
            finishGame();
            return;
        }

        const container = document.getElementById('game-container');
        container.innerHTML = '';
        container.className = 'game-card question-enter';

        const qData = questions[index];
        const type = qData.type;
        const q = qData.question || {};

        // Question Header
        if (q.text) {
            const title = document.createElement('div');
            title.className = 'question-header';
            title.innerHTML = `
                <div class="question-text">${q.text}</div>
                <div class="question-number">Question ${index + 1}</div>
            `;
            container.appendChild(title);
        }

        // Content Area
        const contentDiv = document.createElement('div');
        contentDiv.className = 'game-content';

        if (type === 'option') {
            renderOptionGame(contentDiv, qData);
        } else if (type === 'cards') {
            renderCardsGame(contentDiv, qData);
        } else if (type === 'dragDrop') {
            renderDragDropGame(contentDiv, qData);
        } else if (type === 'writing') {
            renderWritingGame(contentDiv, qData);
        } else if (type === 'matchingGame') {
            renderMatchingGame(contentDiv, qData);
        } else {
            contentDiv.innerHTML = `
                <div class="unsupported-game">
                    <i class="bi bi-exclamation-triangle"></i>
                    <h3>Game type not supported</h3>
                    <p>Type: ${type}</p>
                    <button class="btn btn-secondary" onclick="nextQuestion()">Skip Question</button>
                </div>
            `;
        }

        container.appendChild(contentDiv);
        updateStats();
        
        // Trigger entrance animation
        setTimeout(() => container.classList.add('question-enter-active'), 50);
    }

    // --- Enhanced Game Renderers ---
    function renderOptionGame(container, data) {
        const optionsDiv = document.createElement('div');
        optionsDiv.className = 'options-grid';

        const opts = data.question.options || [];
        opts.forEach((opt, index) => {
            if (!opt) return;
            
            const optionCard = document.createElement('div');
            optionCard.className = 'option-card';
            optionCard.style.animationDelay = `${index * 0.1}s`;
            
            optionCard.innerHTML = `
                <div class="card-content">
                    <div class="card-icon">
                        <i class="bi bi-${getRandomIcon()}"></i>
                    </div>
                    <div class="card-text">${opt}</div>
                </div>
                <div class="card-glow"></div>
            `;
            
            optionCard.onclick = () => {
                playClickSound();
                checkAnswer(opt, data.question.correct_answer);
                optionCard.classList.add('selected');
            };
            
            optionsDiv.appendChild(optionCard);
        });
        
        container.appendChild(optionsDiv);
    }

    function renderCardsGame(container, data) {
        const cardsDiv = document.createElement('div');
        cardsDiv.className = 'cards-grid';

        const opts = data.options || [];
        opts.forEach((opt, index) => {
            const card = document.createElement('div');
            card.className = 'game-card-item';
            card.style.animationDelay = `${index * 0.15}s`;
            
            let imgHtml = '';
            if (opt.icon) {
                imgHtml = `<div class="card-image"><img src="${opt.icon}" alt="${opt.text}"></div>`;
            }

            card.innerHTML = `
                ${imgHtml}
                <div class="card-label">${opt.text}</div>
                <div class="card-back">
                    <i class="bi bi-question-lg"></i>
                </div>
            `;
            
            card.onclick = () => {
                playClickSound();
                card.classList.add('flipped');
                setTimeout(() => {
                    checkAnswer(opt.text, data.question.correct_answer);
                }, 600);
            };
            
            cardsDiv.appendChild(card);
        });
        
        container.appendChild(cardsDiv);
    }

    function renderWritingGame(container, data) {
        container.innerHTML = `
            <div class="writing-game">
                <div class="writing-input-group">
                    <div class="input-wrapper">
                        <input type="text" id="writing-input" class="writing-input" placeholder="Type your answer here..." autocomplete="off">
                        <div class="input-glow"></div>
                    </div>
                    <button class="writing-submit-btn" onclick="checkWritingAnswer('${data.question.correct_answer}')">
                        <i class="bi bi-check-lg"></i>
                        Check Answer
                    </button>
                </div>
                <div class="writing-hint">
                    <i class="bi bi-lightbulb"></i>
                    Type your answer and click check!
                </div>
            </div>
        `;
        
        // Focus input and add enter key support (must be deferred until element is in the DOM)
        setTimeout(() => {
            const writingInput = document.getElementById('writing-input');
            if (writingInput) {
                writingInput.focus();
                writingInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        checkWritingAnswer(data.question.correct_answer);
                    }
                });
            }
        }, 100);
    }

    function renderDragDropGame(container, data) {
        const correctOrder = data.question.correct_order || [];
        const shuffled = data.question.options || [...correctOrder].sort(() => Math.random() - 0.5);

        container.innerHTML = `
            <div class="drag-drop-game">
                <div class="drop-zone" id="answer-zone">
                    <div class="zone-placeholder">
                        <i class="bi bi-hand-index"></i>
                        <span>Click words to build your answer</span>
                    </div>
                </div>
                <div class="source-zone" id="source-zone">
                    ${shuffled.map((item, index) => `
                        <button class="word-bubble" style="animation-delay: ${index * 0.1}s" onclick="moveToAnswer(this)">
                            ${item}
                        </button>
                    `).join('')}
                </div>
                <div class="game-actions">
                    <button class="action-btn btn-reset" onclick="resetOrder()">
                        <i class="bi bi-arrow-clockwise"></i> Reset
                    </button>
                    <button class="action-btn btn-submit" onclick="checkOrderAnswerFromZone(['${correctOrder.join("','")}'])">
                        <i class="bi bi-check-lg"></i> Listo
                    </button>
                </div>
            </div>
        `;
    }

    function renderMatchingGame(container, data) {
        const pairs = data.pairs || [];
        const lefts = pairs.map((p, i) => ({ val: p.item1, id: i }));
        const rights = pairs.map((p, i) => ({ val: p.item2, id: i })).sort(() => Math.random() - 0.5);

        container.innerHTML = `
            <div class="matching-game">
                <div class="matching-instructions">
                    <i class="bi bi-link-45deg"></i>
                    Match the items on both sides
                </div>
                <div class="matching-columns">
                    <div class="matching-column left-column" id="match-left">
                        ${lefts.map(l => `
                            <button class="match-item match-left" data-side="left" data-id="${l.id}" onclick="selectMatch(this)">
                                <i class="bi bi-circle"></i>
                                <span>${l.val}</span>
                            </button>
                        `).join('')}
                    </div>
                    <div class="matching-column right-column" id="match-right">
                        ${rights.map(r => `
                            <button class="match-item match-right" data-side="right" data-id="${r.id}" onclick="selectMatch(this)">
                                <i class="bi bi-circle"></i>
                                <span>${r.val}</span>
                            </button>
                        `).join('')}
                    </div>
                </div>
                <div class="match-feedback" id="match-feedback"></div>
            </div>
        `;
        
        container.querySelector('.matching-game').dataset.matchesfound = 0;
        container.querySelector('.matching-game').dataset.totalpairs = pairs.length;
        window.selectedLeft = null;
        window.selectedRight = null;
    }

    // --- Helper Functions ---
    function getRandomIcon() {
        const icons = ['star', 'heart', 'gem', 'flower1', 'tree', 'cloud', 'sun', 'moon'];
        return icons[Math.floor(Math.random() * icons.length)];
    }

    // --- Game Logic ---
    function checkAnswer(userAnswer, correctAnswer, type) {
        const isCorrect = userAnswer.toString().trim().toLowerCase() === correctAnswer.toString().trim().toLowerCase();
        const currentType = questions[currentIndex].type;
        
        if (isCorrect) {
            score += 10;
            correctCount++;
            combo++;
            maxCombo = Math.max(maxCombo, combo);
            playSuccessSound();
            updateStats();
            showScorePopup(10);
        } else {
            combo = 0;
            playErrorSound();
        }
        
        recordAnswer(userAnswer, isCorrect, currentType);
        handleResult(isCorrect);
    }

    function checkWritingAnswer(correct) {
        const input = document.getElementById('writing-input') || document.getElementById('complete-input');
        const userAnswer = input.value.trim();
        checkAnswer(userAnswer, correct);
    }

    function recordAnswer(userAnswer, isCorrect, type) {
        userAnswers.push({
            question: questions[currentIndex].question.text || type,
            user_answer: userAnswer,
            correct: isCorrect,
            q_index: currentIndex
        });
    }

    function handleResult(isCorrect, customMsg) {
        const container = document.getElementById('game-container');
        
        // Create result overlay
        const overlay = document.createElement('div');
        overlay.className = `result-overlay ${isCorrect ? 'correct' : 'incorrect'}`;
        
        overlay.innerHTML = `
            <div class="result-content">
                <div class="result-icon">
                    ${isCorrect ? 
                        '<i class="bi bi-check-circle-fill"></i>' : 
                        '<i class="bi bi-x-circle-fill"></i>'
                    }
                </div>
                <h2 class="result-message">${customMsg || (isCorrect ? 'Correct!' : 'Incorrect')}</h2>
                ${isCorrect && combo > 1 ? `<div class="combo-text">Combo x${combo}! 🔥</div>` : ''}
                <button class="result-btn" onclick="nextQuestion()">
                    Next Question <i class="bi bi-arrow-right"></i>
                </button>
            </div>
        `;
        
        container.appendChild(overlay);
    }

    function nextQuestion() {
        currentIndex++;
        showQuestion(currentIndex);
    }

    function finishGame() {
        const finalTime = stopTimer();
        const container = document.getElementById('game-container');
        const percent = (score / maxScore) * 100;
        let stars = 1;
        if (percent > 60) stars = 3;
        else if (percent > 30) stars = 2;
        const mins = String(Math.floor(finalTime / 60)).padStart(2, '0');
        const secs = String(finalTime % 60).padStart(2, '0');

        container.innerHTML = `
            <div class="completion-screen">
                <div class="completion-content">
                    <div class="completion-header">
                        <h2 class="completion-title">Level Complete!</h2>
                        <div class="stars-display">
                            ${Array.from({length: 3}, (_, i) => 
                                `<i class="bi bi-${i < stars ? 'star-fill star-gold' : 'star star-gray'}"></i>`
                            ).join('')}
                        </div>
                    </div>
                    
                    <div class="completion-stats">
                        <div class="stat-row">
                            <span class="stat-label">Final Score</span>
                            <span class="stat-value">${score} / ${maxScore}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">Accuracy</span>
                            <span class="stat-value">${Math.round(percent)}%</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">Best Combo</span>
                            <span class="stat-value">${maxCombo}x</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">Time</span>
                            <span class="stat-value">${mins}:${secs}</span>
                        </div>
                    </div>
                    
                    <div class="completion-message">
                        ${percent >= 80 ? '🎉 Outstanding!' : 
                          percent >= 60 ? '🌟 Great job!' : 
                          percent >= 40 ? '👍 Good effort!' : 
                          '💪 Keep practicing!'}
                    </div>
                    
                    <button class="completion-btn" onclick="submitResults(${score}, ${stars})">
                        <i class="bi bi-trophy"></i>
                        Continue to Dashboard
                    </button>
                </div>
            </div>
        `;
        
        // Play completion sound
        playSuccessSound();
        setTimeout(() => playSuccessSound(), 200);
        setTimeout(() => playSuccessSound(), 400);
    }

    function submitResults(finalScore, finalStars) {
        document.getElementById('input-score').value = finalScore;
        document.getElementById('input-stars').value = finalStars;
        document.getElementById('input-answers').value = JSON.stringify(userAnswers);
        document.getElementById('input-time').value = elapsedSeconds;
        document.getElementById('game-form').submit();
    }

    // Global functions for inline onclick handlers
    window.nextQuestion = nextQuestion;
    window.submitResults = submitResults;
    window.checkWritingAnswer = checkWritingAnswer;

    window.moveToAnswer = function(btn) {
        playClickSound();
        const zone = document.getElementById('answer-zone');
        const placeholder = zone.querySelector('.zone-placeholder');
        if (placeholder) placeholder.remove();

        btn.onclick = () => {
            playClickSound();
            document.getElementById('source-zone').appendChild(btn);
            btn.onclick = () => moveToAnswer(btn);
        };
        zone.appendChild(btn);
    };

    window.resetOrder = function() {
        playClickSound();
        showQuestion(currentIndex);
    };

    window.checkOrderAnswerFromZone = function(correctArr) {
        const zone = document.getElementById('answer-zone');
        const userItems = Array.from(zone.children).map(btn => btn.innerText.trim());
        const isCorrect = JSON.stringify(userItems) === JSON.stringify(correctArr);
        
        if (isCorrect) {
            score += 10;
            correctCount++;
            combo++;
            maxCombo = Math.max(maxCombo, combo);
            playSuccessSound();
            updateStats();
            showScorePopup(10);
        } else {
            combo = 0;
            playErrorSound();
        }

        recordAnswer(userItems.join(', '), isCorrect, 'dragDrop');
        handleResult(isCorrect, isCorrect ? "Perfect Order!" : "Wrong Order!");
    };

    window.selectMatch = function(btn) {
        playClickSound();
        const side = btn.dataset.side;
        const id = btn.dataset.id;

        const col = side === 'left' ? 'match-left' : 'match-right';
        document.getElementById(col).querySelectorAll('.match-item').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        if (side === 'left') window.selectedLeft = btn;
        else window.selectedRight = btn;

        if (window.selectedLeft && window.selectedRight) {
            const id1 = window.selectedLeft.dataset.id;
            const id2 = window.selectedRight.dataset.id;

            if (id1 === id2) {
                playSuccessSound();
                window.selectedLeft.classList.add('matched');
                window.selectedRight.classList.add('matched');
                window.selectedLeft.onclick = null;
                window.selectedRight.onclick = null;

                window.selectedLeft = null;
                window.selectedRight = null;

                const container = document.getElementById('game-container').querySelector('.matching-game');
                let found = parseInt(container.dataset.matchesfound) + 1;
                container.dataset.matchesfound = found;

                // Score per pair
                const totalPairs = parseInt(container.dataset.totalpairs);
                const pointsPerPair = Math.round(10 / totalPairs) || 1;
                score += pointsPerPair;
                correctCount++;
                combo++;
                maxCombo = Math.max(maxCombo, combo);
                updateStats();
                showScorePopup(pointsPerPair);

                if (found >= totalPairs) {
                    recordAnswer("Completed all matches", true, 'matchingGame');
                    handleResult(true, "All matched perfectly!");
                }
            } else {
                combo = 0;
                playErrorSound();
                const feedback = document.getElementById('match-feedback');
                feedback.innerHTML = '<i class="bi bi-x-circle"></i> Try again!';
                feedback.className = 'match-feedback incorrect';
                
                setTimeout(() => {
                    if (window.selectedLeft) window.selectedLeft.classList.remove('active');
                    if (window.selectedRight) window.selectedRight.classList.remove('active');
                    window.selectedLeft = null;
