{% extends 'core/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0" style="border-radius: 16px;">
            <div class="card-header bg-primary text-white" style="border-radius: 16px 16px 0 0;">
                <h3 class="mb-0">
                    <i class="bi bi-person-badge"></i>
                    {% if teacher %}Edit Teacher{% else %}Create Teacher{% endif %}
                </h3>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="first_name" class="form-label fw-bold">First Name</label>
                            <input type="text" class="form-control" name="first_name"
                                   value="{{ teacher.first_name|default:'' }}" placeholder="First name">
                        </div>
                        <div class="col-md-6">
                            <label for="last_name" class="form-label fw-bold">Last Name</label>
                            <input type="text" class="form-control" name="last_name"
                                   value="{{ teacher.last_name|default:'' }}" placeholder="Last name">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="username" class="form-label fw-bold">Username *</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" name="username"
                                   value="{{ teacher.username|default:'' }}" required placeholder="Username">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label fw-bold">Email</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" name="email"
                                   value="{{ teacher.email|default:'' }}" placeholder="email@example.com">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label fw-bold">
                            Password {% if teacher %}<small class="text-muted">(leave blank to keep current)</small>{% else %}*{% endif %}
                        </label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" name="password"
                                   {% if not teacher %}required{% endif %} placeholder="Password">
                        </div>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle"></i>
                            {% if teacher %}Update Teacher{% else %}Create Teacher{% endif %}
                        </button>
                        <a href="{% url 'teacher_list' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
