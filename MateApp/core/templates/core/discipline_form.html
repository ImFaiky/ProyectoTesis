{% extends 'core/base.html' %}

{% block content %}
<h2>{{ view.action }} Discipline</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'discipline_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
